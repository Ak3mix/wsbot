services:
  - type: web
    name: wsbot
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ALLOWED_USERS
        sync: false
      - key: ALLOWED_GROUPS
        sync: false
      - key: KEYWORDS
        sync: false
      - key: AUTO_REPLIES
        sync: false
      - key: DEBUG_MODE
        sync: false
      - key: QR_TOKEN
        sync: false
      - key: RESTART_TOKEN
        sync: false
      - key: LOGS_TOKEN
        sync: false
      - key: REPLY_DELAY_MIN
        sync: false
      - key: REPLY_DELAY_MAX
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_ALLOWED_IDS
        sync: false
      - key: NOTIFY_REPLY
        sync: false
      - key: BOT_ROLE
        sync: false
      - key: TELEGRAM_POLL
        sync: false
      - key: PEER_URL
        sync: false
      - key: PEER_ROLE
        sync: false
      - key: PEER_TOKEN
        sync: false